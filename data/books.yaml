# Books on the shelf (shortcode: {{< bookshelf >}})
# Each entry is one spine.
#   image:  PNG of the spine (straight-on view, cropped to the spine edges)
#   width:  spine thickness in mm
#   height: book height in mm
#   title:  shown on hover and read by screen readers
#   url:    optional link, e.g. to the project page (use the same path in both languages)
# Put the PNGs in static/images/ksiazki/
# The order here doesn't matter: the shelf is shuffled on every page load.

